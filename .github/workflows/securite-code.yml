# Contrôle « code sûr et non pollué » — défensif uniquement.
#
# Choix assumé : ce workflow n'utilise AUCUNE action tierce (pas même
# actions/checkout). Le code source est récupéré avec git, épinglé sur le SHA
# exact du commit contrôlé. Raison : une action référencée par étiquette mobile
# (@v4) peut être réécrite côté éditeur ; c'est le vecteur d'attaque n°1 sur les
# chaînes d'intégration continue. Un contrôle de sécurité ne doit pas lui-même
# introduire la dépendance qu'il dénonce.
name: Sécurité du code

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read          # moindre privilège : lecture seule, aucun droit d'écriture

concurrency:
  group: securite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code (sans action tierce, épinglé au SHA du commit)
        env:
          DEPOT: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "https://github.com/${DEPOT}"
          # Historique COMPLET, pas --depth 1 : le contrôle des rapports doit pouvoir
          # dire si un commit cité existe réellement. Dans un clone superficiel,
          # « git cat-file -e » répond non pour un commit qui existe (fiche E-11).
          # 70 commits, 3,5 Mo : le coût est nul, l'aveuglement ne l'était pas.
          git fetch -q origin "${COMMIT}"
          git checkout -q FETCH_HEAD
          echo "Commit contrôlé : ${COMMIT}"

      - name: Audit maison — secrets, dépendances, actions CI, code à risque, licences
        run: python3 scripts/audit_code_sur.py

      - name: Cloisonnement des produits (BLOQUANT depuis la phase 5, 2026-09-11)
        # Contrôle bloquant : un import croisé entre deux produits, un répertoire
        # inattendu à la racine, un shared/ qui dépend d'un produit ou un module non
        # rattaché échouent ce workflow — donc interdisent de merger (CLAUDE.md §2 bis).
        # La règle est ainsi tenue par la machine et non par la mémoire : c'est la leçon
        # des fiches E-01 et E-07 de .claude/BASE-ERREURS.md, où une règle écrite puis
        # laissée sans mécanisme d'application a cédé deux fois.
        # Détection prouvée par test piégé avant la bascule (voir le message de commit).
        run: python3 scripts/audit_cloisonnement.py --bloquant

      - name: Registre d'erreurs à jour (BLOQUANT)
        # « 🔴 ERREURS.md » (§12) est GÉNÉRÉ depuis .claude/BASE-ERREURS.md, qui fait foi.
        # Ce contrôle échoue si les deux ont divergé — parce qu'ils ont réellement divergé
        # le 2026-09-11 : deux registres d'erreurs coexistaient sans que rien ne les compare
        # (fiche E-18). Un index dérivé et vérifié ne peut plus dériver en silence.
        run: python3 scripts/generer_registre_erreurs.py --verifier

      - name: Inventaire de la base à jour (BLOQUANT)
        # « codex/BASE/INVENTAIRE.md » est ENGENDRÉ depuis les dépôts réels et le relevé Drive.
        # Il répond à la seule question qui a compté jusqu'ici : combien d'endroits gardent chaque
        # chose ? Deux projets ont été perdus parce qu'ils n'existaient qu'à un seul endroit (le
        # site La Loi, le code v0.2 du 06/09). Un inventaire écrit à la main cesse d'être vrai en
        # silence — celui-ci échoue bruyamment dès qu'il a dérivé.
        run: python3 scripts/inventorier.py --verifier

      - name: Rapports déposés — traces recoupées (BLOQUANT)
        # Contrôle de la partie surveillée par la machine. La « phrase de contrôle honnête »
        # du §2 ter est écrite par l'agent qui se contrôle lui-même : elle ne prouve rien.
        # Ce contrôle-ci ne juge pas la sincérité, il recoupe les TRACES — commit cité qui
        # n'existe pas, chemin inventé, run cité sans URL, confiance en pourcentage (interdite
        # par le §13), « VÉRIFIÉ » affirmé sans preuve. Motif : fiches E-11 et E-13, où l'erreur
        # n'était pas un mensonge mais une trace jamais recoupée.
        # Sept pièges posés avant la bascule, sept détectés ; témoin vert (voir le commit).
        run: python3 scripts/verifier_rapports.py

      - name: pip-audit — CVE des dépendances DU PROJET (pas de l'environnement du runner)
        continue-on-error: true   # informatif : l'absence de CVE connue ne prouve pas l'absence de faille
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check uv "pip-audit>=2.10.1"
          # Sans -r, pip-audit analyse les paquets préinstallés d'Ubuntu (cloud-init, ufw…) :
          # des CVE réelles mais SANS rapport avec ce projet. On audite donc le verrou du projet.
          if uv export --frozen --no-dev --no-emit-project --format requirements-txt -o /tmp/dependances-projet.txt 2>/dev/null; then
            echo "Dépendances auditées (extraites de uv.lock) :"
            grep -cv '^\s*#' /tmp/dependances-projet.txt || true
            python3 -m pip_audit -r /tmp/dependances-projet.txt --progress-spinner off \
              || echo "::warning::pip-audit a signalé des CVE sur les dépendances du projet (voir ci-dessus)"
          else
            echo "::warning::Export de uv.lock impossible — audit CVE NON EXÉCUTÉ sur ce run (aucun résultat n'est affirmé)."
          fi

      - name: Rappel honnête
        if: always()
        run: |
          echo "Ce contrôle détecte des motifs connus et les CVE publiées."
          echo "Il ne remplace pas une relecture humaine avant d'intégrer du code tiers."
